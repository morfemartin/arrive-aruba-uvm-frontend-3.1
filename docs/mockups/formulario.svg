<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <!-- Mockup · Página de FORMULARIO DE RESERVA · e-actividad 3.1 (realizado por Martin Morfe Flores.°.) -->
  <title id="t">Mockup · Formulario · Arrive Aruba</title>
  <desc id="d">Maqueta del formulario de reserva: tarjeta con campos, tallas, cantidad, botón de guardado y panel lateral explicativo.</desc>
  <rect width="1280" height="800" fill="#f0f0e5"/>

  <!-- Cabecera -->
  <rect width="1280" height="56" fill="#ffffff" stroke="#d8ddd0"/>
  <circle cx="40" cy="28" r="9" fill="#386395"/>
  <rect x="56" y="20" width="90" height="14" rx="7" fill="#1c2b3a"/>
  <rect x="840" y="22" width="46" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="900" y="22" width="54" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="966" y="22" width="46" height="10" rx="5" fill="#386395"/>
  <rect x="1024" y="22" width="54" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="1090" y="22" width="66" height="10" rx="5" fill="#4a5b6c"/>

  <!-- Título -->
  <text x="70" y="120" font-size="11" fill="#5f8bb8" letter-spacing="3">FORMULARIO DE RESERVA</text>
  <rect x="70" y="136" width="300" height="30" rx="10" fill="#1c2b3a"/>
  <rect x="70" y="176" width="340" height="10" rx="5" fill="#4a5b6c"/>

  <!-- Tarjeta del formulario (columna izquierda, 60%) -->
  <rect x="70" y="210" width="660" height="460" rx="22" fill="#ffffff" stroke="#d8ddd0"/>
  <!-- Campo nombre (con error simulado) -->
  <text x="102" y="252" font-size="10" fill="#1c2b3a">NOMBRE COMPLETO *</text>
  <rect x="102" y="262" width="596" height="38" rx="10" fill="#ffffff" stroke="#b4552f" stroke-width="2"/>
  <text x="114" y="286" font-size="11" fill="#b4552f">Escribe tu nombre y apellido.</text>
  <!-- Campo email -->
  <text x="102" y="330" font-size="10" fill="#1c2b3a">CORREO ELECTRÓNICO *</text>
  <rect x="102" y="340" width="596" height="38" rx="10" fill="#ffffff" stroke="#d8ddd0"/>
  <!-- Campo teléfono + prenda (2 columnas) -->
  <text x="102" y="408" font-size="10" fill="#1c2b3a">TELÉFONO *</text>
  <rect x="102" y="418" width="280" height="38" rx="10" fill="#ffffff" stroke="#d8ddd0"/>
  <text x="422" y="408" font-size="10" fill="#1c2b3a">PRENDA *</text>
  <rect x="422" y="418" width="276" height="38" rx="10" fill="#ffffff" stroke="#d8ddd0"/>
  <path d="M678 434 L686 442 L694 434" stroke="#4a5b6c" stroke-width="2" fill="none"/>
  <!-- Tallas -->
  <text x="102" y="486" font-size="10" fill="#1c2b3a">TALLA *</text>
  <rect x="102" y="496" width="44" height="32" rx="16" fill="#386395"/>
  <rect x="154" y="496" width="44" height="32" rx="16" fill="#ffffff" stroke="#386395" stroke-width="2"/>
  <rect x="206" y="496" width="44" height="32" rx="16" fill="#ffffff" stroke="#386395" stroke-width="2"/>
  <rect x="258" y="496" width="44" height="32" rx="16" fill="#ffffff" stroke="#386395" stroke-width="2"/>
  <rect x="310" y="496" width="44" height="32" rx="16" fill="#ffffff" stroke="#386395" stroke-width="2"/>
  <!-- Cantidad -->
  <text x="420" y="486" font-size="10" fill="#1c2b3a">CANTIDAD *</text>
  <rect x="420" y="496" width="110" height="32" rx="10" fill="#ffffff" stroke="#d8ddd0"/>
  <!-- Notas -->
  <text x="102" y="562" font-size="10" fill="#1c2b3a">NOTAS (OPCIONAL)</text>
  <rect x="102" y="572" width="596" height="56" rx="10" fill="#ffffff" stroke="#d8ddd0"/>
  <!-- Botón de envío -->
  <rect x="102" y="632" width="250" height="32" rx="16" fill="#386395"/>
  <text x="150" y="653" font-size="11" fill="#ffffff">Guardar reserva</text>

  <!-- Panel explicativo (columna derecha, 40%) -->
  <rect x="770" y="210" width="440" height="300" rx="22" fill="#f0f0e5" stroke="#d8ddd0"/>
  <rect x="802" y="244" width="240" height="20" rx="8" fill="#1c2b3a"/>
  <rect x="802" y="286" width="376" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="310" width="340" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="350" width="376" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="374" width="320" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="414" width="376" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="438" width="300" height="10" rx="5" fill="#4a5b6c"/>
  <rect x="802" y="462" width="4" height="28" fill="#5f8bb8"/>

  <!-- Pie de página -->
  <rect y="700" width="1280" height="100" fill="#2c4e78"/>
  <circle cx="70" cy="730" r="8" fill="#f0f0e5"/>
  <rect x="86" y="724" width="90" height="12" rx="6" fill="#f0f0e5"/>
  <rect x="600" y="724" width="70" height="8" rx="4" fill="#5f8bb8"/>
  <rect x="880" y="724" width="110" height="8" rx="4" fill="#5f8bb8"/>
  <text x="640" y="790" font-size="10" fill="#f0f0e5" opacity="0.7">© 2026 Arrive Aruba · e-actividad 3.1 · Mockup 4/6</text>
</svg>
