# ==============================================================
# Validación automática de las páginas HTML del proyecto.
# En cada push se ejecuta el validador oficial del W3C
# (Nu Html Checker) sobre todas las páginas del sitio.
# ==============================================================
name: Validación HTML (W3C Nu Html Checker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    name: Validar páginas HTML
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El release oficial publica vnu.jar como archivo directo:
      # la URL del zip que se usaba antes devolvía un 404.
      - name: Descargar Nu Html Checker (vnu.jar)
        run: |
          wget -q -O vnu.jar https://github.com/validator/validator/releases/download/latest/vnu.jar

      - name: Validar todas las páginas HTML
        run: java -jar vnu.jar *.html
